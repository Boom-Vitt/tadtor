name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        thainlp: [with, without]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: matrix.thainlp == 'with'
        run: pip install pythainlp
      - run: python tests/test_scripts.py
      - run: for f in .claude-plugin/*.json .codex-plugin/*.json .agents/plugins/*.json; do python -m json.tool "$f" > /dev/null; done
